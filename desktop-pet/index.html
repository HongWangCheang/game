<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; img-src 'self'; media-src 'self' mediastream:; style-src 'self' 'unsafe-inline'">
  <title>森里小企鹅</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; font-family: -apple-system, "PingFang SC", sans-serif; }
    #pet { position: absolute; left: 10px; bottom: 0; width: 180px; height: 180px; cursor: grab; }
    #pet.facing-left { transform: scaleX(-1); }
    #pet.hop { animation: hop .4s ease-out; }
    @keyframes hop { 40% { translate: 0 -14px; } }
    #bubble { position: absolute; left: 50%; top: 6px; transform: translate(-50%, 6px); white-space: nowrap; padding: 6px 12px; border-radius: 14px; background: #fffde9f2; border: 1px solid #e6dcb5; color: #2c4b31; font-size: 13px; box-shadow: 0 3px 10px #1c2d231f; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; }
    #bubble.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <span id="bubble"></span>
  <canvas id="pet" width="192" height="192"></canvas>
  <script src="renderer.js"></script>
  <script type="module" src="face.js"></script>
</body>
</html>
